services:
  - type: web
    name: washioo-fe
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.png
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=604800
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /washioo-service-worker.js
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html
